[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartcampus-ai-backend"
version = "0.1.0"
description = "API FastAPI de la plateforme agentique SmartCampus AI (IIT / ISB)."
requires-python = ">=3.11"
authors = [{ name = "SmartCampus AI" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3.6,<1.0",
    "redis>=5.2,<6.0",
    "python-multipart>=0.0.17,<1.0",
    "bcrypt>=4.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Lint & format (ruff) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

# --- Tests (pytest) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
