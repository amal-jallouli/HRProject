# Configuration Alembic - SmartCampus AI
# Les commandes se lancent via le Makefile : make db-upgrade, make db-revision m="..."

[alembic]
script_location = %(here)s/alembic
# L'URL de connexion n'est PAS ici : elle est lue dans .env (DATABASE_URL) par alembic/env.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
